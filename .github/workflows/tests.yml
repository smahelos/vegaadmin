name: Tests

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Tests run on MySQL (phpunit.xml: DB_CONNECTION=mysql, DB_DATABASE=invoice_testing); root may create the
    # invoice_testing_test_N databases of a parallel run. The data directory lives in memory: nothing outlives the job.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: invoice_testing
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up PHP and vendor
        uses: ./.github/actions/setup-backend
      - name: Test suite (parallel)
        run: php artisan test --parallel
