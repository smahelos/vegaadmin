name: Payment Adapter Guard

on:
  pull_request:
  push:
    branches: [ main, develop ]

jobs:
  payment-tests:
    name: Payment Tests (focused + conditional subset)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.3' ] # extend (e.g. '8.2','8.3') when multi-version desired
    # Tests run on MySQL (phpunit.xml: DB_CONNECTION=mysql, DB_DATABASE=invoice_testing)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: invoice_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the change detection diff below
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run payment gateway adapter tests
        run: php artisan test tests/Unit/Domain/Payment/Providers/PaymentGateways tests/Feature/Domain/Payment/Services/GatewayRegistryTest.php
      - name: Detect broader payment changes
        id: paymentdiff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # New branch push (no previous commit) or unknown base: run the full subset
          if [ -z "$BASE" ] || ! git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
            echo "run_full=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE"...HEAD | grep '^app/Domain/Payment/' || true)
          if [ -n "$CHANGED" ]; then echo "run_full=true" >> $GITHUB_OUTPUT; else echo "run_full=false" >> $GITHUB_OUTPUT; fi
      - name: Run full payment test subset (conditional)
        if: steps.paymentdiff.outputs.run_full == 'true'
        run: php artisan test tests/Unit/Domain/Payment/ValueObjects/ tests/Feature/Domain/Payment/

