name: Claude Code

# Automatic review of every pull request against the standard in .claude/ (CLAUDE.md and rules),
# plus answers to "@claude" in PR and issue comments. Authenticates with a Claude subscription
# token (`claude setup-token`) stored as the CLAUDE_CODE_OAUTH_TOKEN secret.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  review:
    # Dependabot runs get no repository secrets
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request's diff against the project standard: .claude/CLAUDE.md and the
            rules in .claude/rules/ that apply to each changed path. The rules are the target standard;
            existing code that predates them is not a template, so judge the changed lines, not the file.

            Report, most severe first:
            1. Bugs and regressions, with the concrete input or state that triggers them.
            2. Security: authorization and ownership checks, input validation, escaping, secrets.
            3. High-risk areas named in CLAUDE.md: money and VAT, invoice numbering, payments, permissions
               and entity limits, invoice PDFs.
            4. Violations of the rules in changed lines, citing the rule file.
            5. Missing tests for changed behaviour.

            Put each finding as an inline comment on the line it concerns, and finish with one summary
            comment. Skip style that Pint enforces and anything you cannot point to in the diff.
            Write in English.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  respond:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Respond
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
