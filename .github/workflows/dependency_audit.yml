name: Dependency Audit

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1' # new advisories appear without any change in the repo

jobs:
  composer-audit:
    name: Composer audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - name: Audit composer.lock
        run: composer audit --locked --no-interaction

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Audit package-lock.json
        # audit-ci runs npm audit with the allowlist in .github/audit-ci.jsonc
        run: npx --yes audit-ci@7.1.0 --config .github/audit-ci.jsonc
