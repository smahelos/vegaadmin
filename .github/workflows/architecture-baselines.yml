name: Architecture Baselines Full Parity

# All architecture gates plus the whole test suite in one job.
# Runs on pull requests (architecture_guard.yml runs only after merge, on push to main/develop)
# and manually from the Actions tab.
on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baselines-parity:
    name: Baselines / Guard / Drift / Tests (Parity)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, exif, gd, intl, pcntl, zip
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: 1. Legacy report
        run: |
          set -e
          php artisan ddd:legacy-report --json > legacy_report_latest.json
          RES=$(php -r '$d=json_decode(file_get_contents("legacy_report_latest.json"),true); echo $d["counts"]["residuals"];')
          NEU=$(php -r '$d=json_decode(file_get_contents("legacy_report_latest.json"),true); echo $d["counts"]["neutralized_tests"];')
          echo "Residuals=$RES Neutralized=$NEU"
          if [ "$RES" -gt 0 ]; then echo "::error::Residual legacy artifacts detected ($RES)."; exit 1; fi
          if [ "$NEU" -gt 0 ]; then echo "::warning::Neutralized tests present: $NEU"; fi

      - name: 2. Guards and provider snapshot
        run: |
          set -e
          php artisan ddd:guard
          php artisan payment:adapter-guard
          php artisan ddd:providers:snapshot --diff --format=json > provider_snapshot_diff.json
          grep -q '"errors": \[\]' provider_snapshot_diff.json || { echo '::error::Provider snapshot diff reported errors.'; cat provider_snapshot_diff.json; exit 1; }

      - name: 3. Baseline drift against committed baselines
        run: |
          set -e
          php artisan ddd:controller-thinness:baseline --save
          php artisan ddd:frontend-eloquent:baseline --save --path=build/metrics
          php artisan ddd:api-eloquent:baseline --save --path=build/metrics
          # Compare regenerated baselines with the committed ones, ignoring generation timestamps
          compare() {
            php -r '$b=json_decode(file_get_contents($argv[1]),true); $c=json_decode(file_get_contents($argv[2]),true); unset($b["generated_at"],$c["generated_at"],$b["summary"]["timestamp"],$c["summary"]["timestamp"]); if($b!=$c){fwrite(STDERR,"::error::Baseline drift: ".$argv[1]."\n"); exit(1);} echo "No drift: ".$argv[1]."\n";' "$1" "$2"
          }
          compare architecture/baselines/controller_thinness_baseline.json storage/app/metrics/controller_thinness_baseline.json
          compare architecture/baselines/frontend_controller_eloquent_baseline.json build/metrics/frontend_controller_eloquent_baseline.json
          compare architecture/baselines/api_controller_eloquent_baseline.json build/metrics/api_controller_eloquent_baseline.json

      - name: 4. Architecture enforcement tests
        run: php artisan test tests/Feature/Architecture tests/Feature/Providers

      - name: 5. Full test suite (parallel)
        run: php artisan test --parallel

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baselines-parity-artifacts
          path: |
            legacy_report_latest.json
            provider_snapshot_diff.json
            storage/app/metrics/controller_thinness_baseline.json
            build/metrics/frontend_controller_eloquent_baseline.json
            build/metrics/api_controller_eloquent_baseline.json
