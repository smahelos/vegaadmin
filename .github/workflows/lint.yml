name: Lint

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pint:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Check formatting
        run: vendor/bin/pint --test

  phpcs:
    name: PHP_CodeSniffer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Check multi-line layout
        run: vendor/bin/phpcs

  larastan:
    name: Larastan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=4G --no-progress
