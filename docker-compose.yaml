services:

    # Application
    app:
        # explicit name so the cron service can reuse the image
        image: billex-app
        build:
            context: .
            dockerfile: app.dockerfile
            args:
                # set in .env when the host user is not 1000:1000 (the source is bind-mounted)
                WWW_UID: ${WWW_UID:-1000}
                WWW_GID: ${WWW_GID:-1000}
        container_name: "${CONTAINER_PREFIX}-app"
        user: 'www-data:www-data'
        working_dir: /var/www
        volumes:
            # Development: source (incl. vendor/ and storage/) from the host, code changes apply without a rebuild
            - ./:/var/www
            - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
            - ./docker/php/development-opcache.ini:/usr/local/etc/php/conf.d/zzz-development-opcache.ini:ro
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        depends_on:
            - "database"
        environment:
            PHP_IDE_CONFIG: "serverName=billex-dev.local"
            # The test suite loads .env.testing instead of .env; the connection comes from here, the
            # database name from phpunit.xml (invoice_testing)
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
        networks:
            - billex-network
    # Web Server
    web:
        hostname: ${BASE_NAME}.${BASE_HOST}
        build:
            context: .
            dockerfile: web.dockerfile
        #working_dir: /var/www
        volumes:
            - ./:/var/www
            - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
        depends_on:
            - "app"
        ports:
            - 80:80
        networks:
            - billex-network

    # MySQL Database
    database:
        hostname: ${BASE_NAME}.db.${BASE_HOST}
        restart: unless-stopped
        image: mysql:8.0
        container_name: "${CONTAINER_PREFIX}-db"
        volumes:
            #- ./docker/mysql:/var/lib/mysql
            #- ./docker/mysql/init:/docker-entrypoint-initdb.d
            #- ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
            - data-db:/var/lib/mysql
            - ${DATA_DIR}/db/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
            #- ${DATA_DIR}/log/mysql_slow.log:/var/lib/mysql/mysql_slow.log
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MYSQL_ROOT_USER: ${DB_ROOT_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_USER: ${DB_USERNAME}
            TZ: "Europe/Prague"
        ports:
            - 3306:3306
        networks:
            - billex-network
        healthcheck:
            test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
            timeout: 5s
            retries: 10

    # Database management
    pma:
        image: phpmyadmin:5.2.3
        environment:
            - PMA_ARBITRARY=1
            - PMA_HOST=${DB_HOST}
            - PMA_USER=${DB_ROOT_USERNAME}
            - PMA_PASSWORD=${DB_ROOT_PASSWORD}
            - PMA_PORT=${DB_PORT}
        depends_on:
            - database
        ports:
            - 127.0.0.1:8888:80
        networks:
            - billex-network

    # MailHog for email testing
    mailhog:
        image: mailhog/mailhog
        container_name: "${CONTAINER_PREFIX}-mail"
        hostname: ${BASE_NAME}.mail.${BASE_HOST}
        logging:
            driver: 'none'
        ports:
            - 1025:1025
            - 8025:8025
        networks:
            - billex-network

    # Redis
    redis:
        image: redis:alpine
        container_name: "${CONTAINER_PREFIX}-redis"
        #command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
        command: redis-server --appendonly yes --save 60 1
        volumes:
            - ${DATA_DIR}/redis:/data
        networks:
            - billex-network
        # ports:
        #     - "8002:6379"

    # Scheduler: same image, user and storage as app; schedule:work runs schedule:run every minute
    cron:
        image: billex-app
        container_name: "${CONTAINER_PREFIX}-cron"
        user: 'www-data:www-data'
        working_dir: /var/www
        command: php artisan schedule:work
        volumes:
            - ./:/var/www
            - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        depends_on:
            - app
            - database
            - redis
        networks:
            - billex-network

    # Queue worker: same image, user and storage as app; keeps the code in memory, so code changes need
    # `php artisan queue:restart` (the worker exits after its current job and Docker starts it again);
    # --max-time restarts it hourly as a safety net against stale code and memory leaks
    queue:
        image: billex-app
        container_name: "${CONTAINER_PREFIX}-queue"
        user: 'www-data:www-data'
        working_dir: /var/www
        command: php artisan queue:work --tries=3 --backoff=10 --max-time=3600
        restart: unless-stopped
        volumes:
            - ./:/var/www
            - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        depends_on:
            - app
            - database
            - redis
        networks:
            - billex-network

# Custom network
networks:
    billex-network:
        driver: bridge

volumes:
    #dbdata:
    #    driver: local
    data-db:
    data-redis:
