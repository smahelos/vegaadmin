services:

    # Application
    app:
        build:
            context: .
            dockerfile: app.dockerfile
        container_name: "${CONTAINER_PREFIX}-app"
        user: 'www-data:www-data'
        working_dir: /var/www
        volumes:
            - ${DATA_DIR}/www/adminer:/var/www/adminer
            - ./php/development-opcache.ini:/usr/local/etc/php/conf.d/zzz-development-opcache.ini:ro
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        env_file:
            - ./global.env
        depends_on:
            - "database"
        environment:
            PHP_IDE_CONFIG: "serverName=billex-dev.local"
            PHP_MEMORY_LIMIT: "512M"
            PHP_MAX_EXECUTION_TIME: "30"
        networks:
            - billex-network
    # Web Server
    web:
        hostname: ${BASE_NAME}.${BASE_HOST}
        build:
            context: .
            dockerfile: web.dockerfile
        #working_dir: /var/www
        volumes:
            - ./:/var/www
            - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
        depends_on:
            - "app"
        ports:
            - 80:80
        networks:
            - billex-network

    # MySQL Database
    database:
        hostname: ${BASE_NAME}.db.${BASE_HOST}
        restart: unless-stopped
        image: mysql:8.0
        container_name: "${CONTAINER_PREFIX}-db"
        volumes:
            #- ./docker/mysql:/var/lib/mysql
            #- ./docker/mysql/init:/docker-entrypoint-initdb.d
            #- ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
            - data-db:/var/lib/mysql
            - ${DATA_DIR}/db/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
            #- ${DATA_DIR}/log/mysql_slow.log:/var/lib/mysql/mysql_slow.log
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MYSQL_ROOT_USER: ${DB_ROOT_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_USER: ${DB_USERNAME}
            TZ: "Europe/Prague"
        ports:
            - 3306:3306
        networks:
            - billex-network
        healthcheck:
            test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
            timeout: 5s
            retries: 10

    # Database management
    pma:
        image: phpmyadmin:5.1
        environment:
            - PMA_ARBITRARY=1
            - PMA_HOST=${DB_HOST}
            - PMA_USER=${DB_ROOT_USERNAME}
            - PMA_PASSWORD=${DB_ROOT_PASSWORD}
            - PMA_PORT=${DB_PORT}
        depends_on:
            - database
        ports:
            - 8888:80
        networks:
            - billex-network

    # MailHog for email testing
    mailhog:
        image: mailhog/mailhog
        container_name: "${CONTAINER_PREFIX}-mail"
        hostname: ${BASE_NAME}.mail.${BASE_HOST}
        logging:
            driver: 'none'
        ports:
            - 1025:1025
            - 8025:8025
        networks:
            - billex-network

    # Redis
    redis:
        image: redis:alpine
        container_name: "${CONTAINER_PREFIX}-redis"
        #command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
        command: redis-server --appendonly yes --save 60 1
        volumes:
            - ${DATA_DIR}/redis:/data
        networks:
            - billex-network
        # ports:
        #     - "8002:6379"

    cron:
        image: php:8.3-cli # upravte verzi PHP podle vaší aplikace
        volumes:
            - .:/var/www/html
        command: bash -c "apt-get update && apt-get install -y cron && echo '* * * * * cd /var/www/html && php artisan schedule:run >> /dev/null 2>&1' | crontab - && cron -f"
        depends_on:
            - app

# Custom network
networks:
    billex-network:
        driver: bridge

volumes:
    #dbdata:
    #    driver: local
    data-db:
    data-redis:
