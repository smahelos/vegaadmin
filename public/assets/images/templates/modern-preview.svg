<svg width="300" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern Template Preview -->
  <defs>
    <linearGradient id="modernGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.1)"/>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#modernGradient)"/>
  
  <!-- Container -->
  <rect x="10" y="10" width="280" height="380" fill="white" rx="15" filter="url(#shadow)"/>
  
  <!-- Header -->
  <rect x="30" y="30" width="240" height="60" fill="url(#modernGradient)" rx="15" filter="url(#shadow)"/>
  <circle cx="60" cy="60" r="15" fill="rgba(255,255,255,0.2)" rx="8"/>
  <text x="150" y="55" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">FAKTURA</text>
  <text x="150" y="70" text-anchor="middle" font-family="Arial" font-size="10" fill="white">č. 2024-001</text>
  
  <!-- Supplier Info -->
  <rect x="30" y="110" width="110" height="70" fill="white" stroke="#10b981" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="35" y="115" width="25" height="4" fill="#10b981"/>
  <text x="35" y="125" font-family="Arial" font-size="8" fill="#10b981" font-weight="bold">DODAVATEL</text>
  <rect x="35" y="130" width="80" height="2" fill="#e5e7eb"/>
  <rect x="35" y="135" width="60" height="2" fill="#e5e7eb"/>
  <rect x="35" y="140" width="70" height="2" fill="#e5e7eb"/>
  
  <!-- Client Info -->
  <rect x="160" y="110" width="110" height="70" fill="white" stroke="#f59e0b" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="165" y="115" width="25" height="4" fill="#f59e0b"/>
  <text x="165" y="125" font-family="Arial" font-size="8" fill="#f59e0b" font-weight="bold">ZÁKAZNÍK</text>
  <rect x="165" y="130" width="80" height="2" fill="#e5e7eb"/>
  <rect x="165" y="135" width="60" height="2" fill="#e5e7eb"/>
  <rect x="165" y="140" width="70" height="2" fill="#e5e7eb"/>
  
  <!-- Details Section -->
  <rect x="30" y="200" width="240" height="50" fill="#f8fafc" stroke="#667eea" stroke-width="1" rx="12" filter="url(#shadow)"/>
  <rect x="35" y="205" width="30" height="4" fill="#667eea"/>
  <text x="35" y="215" font-family="Arial" font-size="8" fill="#667eea" font-weight="bold">ÚDAJE</text>
  <rect x="35" y="220" width="90" height="2" fill="#e5e7eb"/>
  <rect x="35" y="225" width="70" height="2" fill="#e5e7eb"/>
  <rect x="165" y="220" width="90" height="2" fill="#e5e7eb"/>
  <rect x="165" y="225" width="80" height="2" fill="#e5e7eb"/>
  
  <!-- Table -->
  <rect x="30" y="270" width="240" height="70" fill="white" rx="8" filter="url(#shadow)"/>
  <rect x="30" y="270" width="240" height="18" fill="url(#modernGradient)" rx="8"/>
  <rect x="30" y="283" width="240" height="5" fill="url(#modernGradient)"/>
  <text x="35" y="278" font-family="Arial" font-size="7" fill="white" font-weight="bold">POLOŽKY</text>
  
  <!-- Table rows -->
  <rect x="35" y="295" width="40" height="2" fill="#6b7280"/>
  <rect x="85" y="295" width="25" height="2" fill="#6b7280"/>
  <rect x="120" y="295" width="30" height="2" fill="#6b7280"/>
  <rect x="160" y="295" width="25" height="2" fill="#6b7280"/>
  <rect x="195" y="295" width="70" height="2" fill="#6b7280"/>
  
  <rect x="35" y="305" width="40" height="2" fill="rgba(102, 126, 234, 0.1)"/>
  <rect x="85" y="305" width="25" height="2" fill="rgba(102, 126, 234, 0.1)"/>
  <rect x="120" y="305" width="30" height="2" fill="rgba(102, 126, 234, 0.1)"/>
  <rect x="160" y="305" width="25" height="2" fill="rgba(102, 126, 234, 0.1)"/>
  <rect x="195" y="305" width="70" height="2" fill="rgba(102, 126, 234, 0.1)"/>
  
  <!-- Total -->
  <rect x="30" y="320" width="240" height="20" fill="url(#modernGradient)" rx="0"/>
  <text x="150" y="330" text-anchor="middle" font-family="Arial" font-size="10" fill="white" font-weight="bold">CELKEM</text>
  
  <!-- Footer -->
  <rect x="30" y="360" width="240" height="2" fill="#e2e8f0"/>
  <text x="150" y="375" text-anchor="middle" font-family="Arial" font-size="8" fill="#6b7280">Moderní šablona</text>
</svg>
