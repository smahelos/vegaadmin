<svg width="300" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Default Template Preview -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="260" height="50" fill="#6DBCFC" rx="5"/>
  <text x="150" y="40" text-anchor="middle" font-family="Arial" font-size="12" fill="white">FAKTURA</text>
  <text x="150" y="55" text-anchor="middle" font-family="Arial" font-size="10" fill="white">č. 2024-001</text>
  
  <!-- Supplier Info -->
  <rect x="20" y="90" width="120" height="80" fill="white" stroke="#10b981" stroke-width="2" rx="5"/>
  <rect x="25" y="95" width="20" height="4" fill="#10b981"/>
  <text x="25" y="105" font-family="Arial" font-size="8" fill="#1f2937">DODAVATEL</text>
  <rect x="25" y="110" width="90" height="2" fill="#e5e7eb"/>
  <rect x="25" y="115" width="70" height="2" fill="#e5e7eb"/>
  <rect x="25" y="120" width="80" height="2" fill="#e5e7eb"/>
  
  <!-- Client Info -->
  <rect x="160" y="90" width="120" height="80" fill="white" stroke="#f59e0b" stroke-width="2" rx="5"/>
  <rect x="165" y="95" width="20" height="4" fill="#f59e0b"/>
  <text x="165" y="105" font-family="Arial" font-size="8" fill="#1f2937">ZÁKAZNÍK</text>
  <rect x="165" y="110" width="90" height="2" fill="#e5e7eb"/>
  <rect x="165" y="115" width="70" height="2" fill="#e5e7eb"/>
  <rect x="165" y="120" width="80" height="2" fill="#e5e7eb"/>
  
  <!-- Details Section -->
  <rect x="20" y="190" width="260" height="60" fill="#f8fafc" stroke="#e2e8f0" rx="5"/>
  <rect x="25" y="195" width="40" height="4" fill="#1e40af"/>
  <text x="25" y="205" font-family="Arial" font-size="8" fill="#1e40af">ÚDAJE O FAKTUŘE</text>
  <rect x="25" y="215" width="100" height="2" fill="#e5e7eb"/>
  <rect x="25" y="220" width="80" height="2" fill="#e5e7eb"/>
  <rect x="165" y="215" width="100" height="2" fill="#e5e7eb"/>
  <rect x="165" y="220" width="90" height="2" fill="#e5e7eb"/>
  
  <!-- Table -->
  <rect x="20" y="270" width="260" height="80" fill="white" stroke="#d1d5db"/>
  <rect x="20" y="270" width="260" height="20" fill="#e5e7eb"/>
  <rect x="25" y="275" width="50" height="2" fill="#1f2937"/>
  <rect x="85" y="275" width="30" height="2" fill="#1f2937"/>
  <rect x="125" y="275" width="40" height="2" fill="#1f2937"/>
  <rect x="175" y="275" width="30" height="2" fill="#1f2937"/>
  <rect x="215" y="275" width="60" height="2" fill="#1f2937"/>
  
  <!-- Table rows -->
  <rect x="25" y="300" width="50" height="2" fill="#6b7280"/>
  <rect x="85" y="300" width="30" height="2" fill="#6b7280"/>
  <rect x="125" y="300" width="40" height="2" fill="#6b7280"/>
  <rect x="175" y="300" width="30" height="2" fill="#6b7280"/>
  <rect x="215" y="300" width="60" height="2" fill="#6b7280"/>
  
  <!-- Total -->
  <rect x="20" y="330" width="260" height="20" fill="#dbeafe"/>
  <text x="150" y="340" font-family="Arial" font-size="10" fill="#1e40af" font-weight="bold">CELKEM</text>
  
  <!-- Footer -->
  <rect x="20" y="370" width="260" height="2" fill="#e2e8f0"/>
  <text x="150" y="385" text-anchor="middle" font-family="Arial" font-size="8" fill="#6b7280">Standardní šablona</text>
</svg>
